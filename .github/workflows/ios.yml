name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run core tests
        run: |
          cd Packages/GuanXingCore
          swift test

      - name: Build app without code signing
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project GuanXing.xcodeproj \
            -scheme GuanXing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 产物"
            exit 1
          fi
          rm -rf build/unsigned
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          (cd build/unsigned && zip -qry "$GITHUB_WORKSPACE/build/GuanXing-unsigned.ipa" Payload)
          ls -lh build/GuanXing-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GuanXing-unsigned-ipa
          path: build/GuanXing-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuanXing-build-log
          path: build/build.log
          retention-days: 7
          if-no-files-found: ignore
